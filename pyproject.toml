[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-eval"
version = "0.1.0"
description = "RSI 三层能力评测框架：目标任务性能、未见任务泛化、改进器自身进化"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.40"]
data = ["datasets>=2.20"]  # 只有 LiveCodeBench 等代码基准需要
upstream = ["openai>=1.40", "backoff", "tqdm", "numpy", "pandas", "scipy"]  # ADAS / Gödel Agent 上游代码的依赖
dev = ["pytest>=8"]

[project.scripts]
rsi-eval = "rsi_eval.cli:main"

[tool.setuptools.packages.find]
include = ["rsi_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
