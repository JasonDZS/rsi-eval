# 主实验：HyperAgents（标准档起）+ HGM（完整档），Polyglot 上演化，
# SWE-bench Verified 子集和 LiveCodeBench 新题上测未见任务。E9–E11 只在 HyperAgents 上做。
name: main
tier: standard
model_config: A
hard_cap_usd: 500           # 按批准的预算改
require_frozen_protocol: true
max_workers: 4
params: {e11_model_config: B, improve_benchmarks: [livecodebench]}
groups:
  - frameworks: [hyperagents]
    evolve_benchmarks: [polyglot]
    unseen_benchmarks: [swebench_verified, livecodebench]
    experiments: [E1, E2, E3, E4, E5, E6, E7, E8, E9, E10, E11]
  - frameworks: [hgm]
    evolve_benchmarks: [polyglot]
    unseen_benchmarks: [swebench_verified, livecodebench]
    experiments: [E1, E2, E3, E4, E5, E6, E7, E8]
