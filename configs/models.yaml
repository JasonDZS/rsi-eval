# 模型定义与角色配置。型号必须写固定版本；price 单位是美元 / 百万 token，用于把 token 换算成金额。
models:
  # ---- 离线假模型（冒烟测试用，不花钱）----
  mock-weak:   {provider: mock, skill: 0.35}
  mock-strong: {provider: mock, skill: 0.60}
  mock-other:  {provider: mock, skill: 0.45, seed: 7}

  # ---- Anthropic（密钥读环境变量 RSI_EVAL_ANTHROPIC_KEY；可在单个模型上用 api_key_env 改）----
  # 价格取自 2026-11 的公开报价，开跑前请核对。
  claude-haiku-5-5:
    provider: anthropic
    model: claude-haiku-5-5
    price: {input: 0.10, output: 0.50}
    max_tokens: 4096
    params: {output_config: {effort: low}}
  claude-sonnet-5-5:
    provider: anthropic
    model: claude-sonnet-5-5
    price: {input: 2.00, output: 10.00}
    max_tokens: 8192
  claude-opus-5-5:
    provider: anthropic
    model: claude-opus-5-5
    price: {input: 4.00, output: 20.00}
    max_tokens: 16000

  # ---- 其他厂商：OpenAI 兼容接口（跑 ADAS / Gödel Agent 用；Claude 5.5 会拒答这两个框架的提示词）----
  # 地址和密钥都读环境变量：RSI_EVAL_OTHER_BASE_URL（形如 https://host:port/v1）、RSI_EVAL_OTHER_KEY。
  # 价格（美元 / 百万 token）是各厂商官网的标价，2026-11-25 查的；中转商实际怎么扣费没有公开页面，所以账本里的美元数是估算，
  # 以中转商后台的实际扣费为准。缓存命中的折扣没有计入（按未命中算，偏高）。
  #   DeepSeek-V4.1-Flash-1017：api-docs.deepseek.com/quick_start/pricing，取高峰价（低谷价是一半）
  #   gpt-6.2-sol：developers.openai.com/api/docs/pricing 的 Standard 档
  #   GLM-5.3-Flash：openrouter.ai/z-ai/glm-5.3-flash 上 Z.ai 直连的标价
  #   gpt-5.6-luna：OpenAI 价格页上没有这个型号，仍是 0（未知）；用到配置 C 之前要补上
  deepseek-v4.1-flash:
    provider: openai_compat
    model: DeepSeek-V4.1-Flash-1017
    base_url_env: RSI_EVAL_OTHER_BASE_URL
    api_key_env: RSI_EVAL_OTHER_KEY
    price: {input: 0.3, output: 1.2}
    max_tokens: 16000
    override_max_tokens: true   # 推理型模型：推理也算在输出上限里，上游写死的 4096 不够用
  glm-5.3-flash:
    provider: openai_compat
    model: GLM-5.3-Flash
    base_url_env: RSI_EVAL_OTHER_BASE_URL
    api_key_env: RSI_EVAL_OTHER_KEY
    price: {input: 0.15, output: 0.5}
    max_tokens: 4096
  gpt-6.2-sol:
    provider: openai_compat
    model: gpt-6.2-sol
    base_url_env: RSI_EVAL_OTHER_BASE_URL
    api_key_env: RSI_EVAL_OTHER_KEY
    price: {input: 2.0, output: 10.0}
    max_tokens: 8192
  gpt-5.6-luna:
    provider: openai_compat
    model: gpt-5.6-luna
    base_url_env: RSI_EVAL_OTHER_BASE_URL
    api_key_env: RSI_EVAL_OTHER_KEY
    price: {input: 0.0, output: 0.0}
    max_tokens: 8192
  # 价格取 openrouter.ai/qwen/qwen3.8-27B 上 Alibaba Cloud Int. 的标价（2026-11-25 查；别家从 0.035 / 1.5 起），同样是估算。
  # 型号名是用户给的写法，中转商那边是否就叫这个名字还没实测。
  qwen3.8-27b:
    provider: openai_compat
    model: Qwen/Qwen3.8-27B
    base_url_env: RSI_EVAL_OTHER_BASE_URL
    api_key_env: RSI_EVAL_OTHER_KEY
    price: {input: 0.425, output: 2.55}
    max_tokens: 8192
    stream_upstream: true       # 向上游要流式输出再拼回来：timeout 变成“多久没收到新内容”，挂死的连接很快重试
    timeout: 90

# 角色：executor 执行模型，improver 改进侧模型，transfer 只用于 E5 的迁移测试模型（演化期间不出现）
model_configs:
  # 配置 A（默认）：强改进侧 + 较弱执行模型
  A: {executor: claude-haiku-5-5, improver: claude-opus-5-5, transfer: claude-sonnet-5-5}
  # 配置 B：执行和改进用同一个模型，严格意义上的“自己改自己”
  B: {executor: claude-sonnet-5-5, improver: claude-sonnet-5-5, transfer: claude-haiku-5-5}
  # 配置 C：其他厂商的模型，给 ADAS / Gödel Agent 用。型号是初步选择，待确认
  C: {executor: deepseek-v4.1-flash, improver: gpt-5.6-luna, transfer: glm-5.3-flash}
  # 配置 D：执行用 gpt-6.2-sol，改进用 DeepSeek
  D: {executor: gpt-6.2-sol, improver: deepseek-v4.1-flash, transfer: glm-5.3-flash}
  # 配置 E：执行用 Qwen3.8-27B（弱一档、给基准留提升空间），改进用 gpt-6.2-sol
  E: {executor: qwen3.8-27b, improver: gpt-6.2-sol, transfer: glm-5.3-flash}
  # 离线
  mockA: {executor: mock-weak, improver: mock-strong, transfer: mock-other}
  mockB: {executor: mock-strong, improver: mock-strong, transfer: mock-other}
